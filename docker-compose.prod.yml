name: moyobom-prod

# 서버(EC2) 배포용. 실행: docker compose -f docker-compose.prod.yml up -d --build
# 프로젝트 이름을 개발용(moyobom)과 다르게 둬서 같은 PC에서도 개발 DB 볼륨을 건드리지 않는다.
# 값은 같은 폴더의 .env에서 읽는다 (docs/deploy.md 참고). DB·백엔드 포트는 밖에 열지 않고 web(Caddy)만 80·443을 연다.
services:
  db:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: moyobom
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD를 .env에 넣어 주세요}
      POSTGRES_DB: moyobom
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U moyobom -d moyobom"]
      interval: 5s
      timeout: 3s
      retries: 10

  # 시작할 때마다 마이그레이션을 적용하고 끝난다
  migrate:
    build:
      context: ./backend
      target: build
    environment:
      DATABASE_URL: postgres://moyobom:${POSTGRES_PASSWORD}@db:5432/moyobom
    command: ["npm", "run", "migrate", "--", "up"]
    depends_on:
      db:
        condition: service_healthy

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgres://moyobom:${POSTGRES_PASSWORD}@db:5432/moyobom
      APP_ORIGIN: https://${DOMAIN:?DOMAIN을 .env에 넣어 주세요}
      # Caddy 컨테이너(사설 IP)가 붙인 X-Forwarded-For를 믿는다
      TRUST_PROXY: uniquelocal
    depends_on:
      migrate:
        condition: service_completed_successfully

  web:
    build: ./frontend
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      # 발급받은 인증서 보관 (지우면 다시 발급받음 — Let's Encrypt 발급 횟수 제한 주의)
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - backend

volumes:
  db-data:
  caddy-data:
  caddy-config:
