name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    services:
      db:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: moyobom
          POSTGRES_PASSWORD: moyobom
          POSTGRES_DB: moyobom_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U moyobom -d moyobom_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      # CI DB는 매번 새로 만들어지므로 개발용·테스트용 주소를 같은 테스트 DB로 둔다
      DATABASE_URL: postgres://moyobom:moyobom@localhost:5432/moyobom_test
      TEST_DATABASE_URL: postgres://moyobom:moyobom@localhost:5432/moyobom_test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - name: 마이그레이션 적용 (DB 테스트 전에)
        run: npm run migrate -- up
      - run: npm test
      - run: npm run build

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  # CD: main에 push되고 검사를 모두 통과하면 서버에 배포한다 (docs/deploy.md "자동 배포")
  # GitHub → (OIDC로 임시 자격 증명) → AWS SSM → 서버 안의 SSM 에이전트가 명령 실행. SSH 포트는 열지 않는다.
  deploy:
    needs: [backend, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    # 배포는 한 번에 하나씩, 진행 중인 배포는 끊지 않는다
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-northeast-2
      - name: 서버에 배포 (SSM)
        env:
          INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
        run: |
          # 검사를 통과한 바로 그 커밋으로만 이동한다 (서버에 다른 변경이 있으면 실패)
          jq -n --arg sha "$GITHUB_SHA" '{
            commands: [
              "set -e",
              "cd /home/ubuntu/MoyoBom",
              "sudo -u ubuntu git fetch -q origin main",
              ("sudo -u ubuntu git merge --ff-only " + $sha),
              "bash scripts/deploy.sh"
            ],
            executionTimeout: ["1800"]
          }' > params.json
          id=$(aws ssm send-command --instance-ids "$INSTANCE_ID" --document-name AWS-RunShellScript \
            --comment "moyobom ${GITHUB_SHA::7}" --parameters file://params.json \
            --query Command.CommandId --output text)
          echo "SSM 명령 $id"
          # 빌드에 몇 분 걸리므로 직접 기다린다 (aws ssm wait는 100초에서 끝남)
          for i in $(seq 1 180); do
            sleep 10
            status=$(aws ssm get-command-invocation --command-id "$id" --instance-id "$INSTANCE_ID" \
              --query Status --output text 2>/dev/null || echo Pending)
            case "$status" in Pending|InProgress|Delayed) continue ;; *) break ;; esac
          done
          aws ssm get-command-invocation --command-id "$id" --instance-id "$INSTANCE_ID" \
            --query '[StandardOutputContent, StandardErrorContent]' --output text
          echo "결과: $status"
          test "$status" = Success
