name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    services:
      db:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: moyobom
          POSTGRES_PASSWORD: moyobom
          POSTGRES_DB: moyobom_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U moyobom -d moyobom_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      # CI DB는 매번 새로 만들어지므로 개발용·테스트용 주소를 같은 테스트 DB로 둔다
      DATABASE_URL: postgres://moyobom:moyobom@localhost:5432/moyobom_test
      TEST_DATABASE_URL: postgres://moyobom:moyobom@localhost:5432/moyobom_test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - name: 마이그레이션 적용 (DB 테스트 전에)
        run: npm run migrate -- up
      - run: npm test
      - run: npm run build

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
